name: Acer Laptop Price Tracker

on:
  # ম্যানুয়ালি রান করার জন্য (Actions ট্যাব থেকে)
  workflow_dispatch:
    inputs:
      search_query:
        description: 'নির্দিষ্ট মডেল খুঁজতে লিখুন (খালি রাখলে সব দেখাবে, যেমন: Nitro বা A315-59)'
        required: false
        default: ''
      only_matched:
        description: 'শুধু যেগুলো অন্য সাইটেও আছে সেগুলো দেখাবেন? (true/false)'
        required: false
        default: 'false'

  # প্রতিদিন সকাল ১০টা এবং রাত ১০টায় (বাংলাদেশ সময়) অটোমেটিক চলবে
  schedule:
    - cron: '0 4,16 * * *'

jobs:
  run-price-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Acer Price Comparator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}
          ONLY_MATCHED: ${{ github.event.inputs.only_matched }}
        run: python github_runner.py
